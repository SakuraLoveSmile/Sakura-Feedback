name: CI

# - PR / 分支推送：只跑检查，绝不发布
# - 被 release.yml 以 workflow_call 复用：先检查通过，才允许发布
on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 供应链卫生：确认没有把本地凭据/数据库/缓存提交进来。发布构建不读取任何生产 .env。
  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 仓库内不得存在被跟踪的凭据、数据库或本地代理记录
        run: |
          set -euo pipefail
          bad=0
          # 凭据/环境文件（.example 模板允许）
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then
            echo "::error::发现被跟踪的 .env 类文件"; bad=1
          fi
          # 数据库与 WAL 文件
          if git ls-files | grep -E '\.db(-journal|-wal|-shm)?$'; then
            echo "::error::发现被跟踪的 SQLite 文件"; bad=1
          fi
          # 本机代理/终端记录与缓存
          if git ls-files | grep -E '(^|/)(\.pnpm-store|node_modules|dist|build|data)/'; then
            echo "::error::发现被跟踪的缓存或构建产物目录"; bad=1
          fi
          if git ls-files | grep -E '(^|/)\.(DS_Store|idea|vscode)/?$' | grep -v '\.vscode/extensions'; then
            echo "::error::发现被跟踪的本机编辑器/系统文件"; bad=1
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "OK: 无凭据/数据库/缓存入库"

  node-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      # 必须先 build：examples/* 依赖 workspace 包 @feedback/web，其类型入口是 dist/index.d.ts，
      # 全新检出时 dist 不存在，直接 typecheck 会报 TS2307 "Cannot find module '@feedback/web'"。
      # 本地能过只是因为恰好留有上次构建产物。顺序固定为 build → typecheck → lint → test。
      - name: build（先产出 workspace 包的 dist 与类型声明）
        run: pnpm -r build
      - name: typecheck
        run: pnpm -r typecheck
      - name: lint
        run: pnpm -r lint
      # 分包串行执行，避免 GitHub runner 上多个 Vitest/SQLite worker 互相影响；
      # 每个包单独成 step，阻塞时能明确定位到具体测试进程。
      - name: test admin
        run: pnpm --filter @feedback/admin test
      - name: test server
        run: pnpm --filter @feedback/server test -- --reporter=verbose
      - name: test updater
        run: pnpm --filter @feedback/updater test -- --reporter=verbose
      - name: test web
        run: pnpm --filter @feedback/web test -- --reporter=verbose

  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3
          channel: stable
          cache: true
      - name: 组件包 analyze + test
        working-directory: flutter/feedback
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: 示例 analyze + test
        working-directory: examples/flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # 安全存储三版本回归矩阵：组件包的约束是 >=9.2.2 <12.0.0，这里把
  # flutter_secure_storage 分别固定到 9.2.2 / 10.3.1 / 11.0.0 逐档跑
  # （隔离宿主 + 复用组件测试），确保不是“只验最新版”。矩阵策略每个 job 一档，
  # 任何一档失败都会让 CI 失败（因此也会挡住 release.yml 的发布）。
  flutter-storage-matrix:
    name: flutter_secure_storage ${{ matrix.storage }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage: ["9.2.2", "10.3.1", "11.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3
          channel: stable
          cache: true
      - name: 固定 ${{ matrix.storage }} 跑组件 analyze + test（隔离宿主，不使用 dependency_overrides）
        run: bash tools/flutter-storage-matrix/run.sh "${{ matrix.storage }}"
      - name: 归档本档证据（日志、解析版本、校验结论）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-storage-matrix-${{ matrix.storage }}
          path: tools/flutter-storage-matrix/out/
          if-no-files-found: warn
