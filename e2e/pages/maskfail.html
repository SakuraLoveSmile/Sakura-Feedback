<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>E2E 宿主页 · 遮挡失败规则</title>
    <!--
      e2e 专用宿主页（不是产品代码）：用于验证「可见敏感区无法遮挡 → 本次截图必须失败」
      的失败规则。三条可切换的触发路径（同一次运行只用其中一条）：

      1. #fragile-wrap 加 data-html2canvas-ignore（渲染器自己的忽略开关）：
         真实文档里 #fragile-secret 仍然可见（会被 countVisibleSensitiveRegions 计入），
         但克隆文档里整棵子树被丢弃 → 克隆定位数 < 真实可见数 → locate-failed。
      2. tag 机制：<e2e-secret-box> 只靠标签选择器布局，html2canvas 把自定义元素
         克隆成普通 div（createCustomElementClone），标签规则失配 → 克隆里没有可见盒
         → 同样 locate-failed。
      3. 泄漏型 captureProvider：返回一张真实的、未遮挡的截图（含敏感区原像素）且
         未声明同帧遮挡 → 组件必须拒绝使用该截图（provider-unsafe）。

      第一次截图（未加任何触发条件时）必须成功，用来验证失败后「旧截图/旧草稿保留」。
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }
      body {
        position: relative;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .block {
        position: absolute;
        color: #000000;
        font-size: 18px;
        padding: 8px;
        box-sizing: border-box;
      }
      #visible-block {
        position: absolute;
        left: 60px;
        top: 60px;
        width: 320px;
        height: 180px;
        background: #00ff00;
      }
      #fragile-wrap {
        position: absolute;
        left: 500px;
        top: 80px;
        width: 360px;
        height: 200px;
      }
      #fragile-secret {
        width: 100%;
        height: 100%;
        background: #ff00ff;
        color: #ffff00;
        font-size: 18px;
        padding: 8px;
        box-sizing: border-box;
      }
      /* 机制 2：只靠标签选择器布局的自定义元素（克隆里会变成普通 div，规则失配） */
      e2e-secret-box {
        display: block;
        width: 360px;
        height: 200px;
        background: #ff00ff;
        color: #ffff00;
        font-size: 18px;
        padding: 8px;
        box-sizing: border-box;
      }
      #tag-trigger {
        position: absolute;
        left: 500px;
        top: 80px;
      }
      #controls {
        position: absolute;
        left: 60px;
        top: 620px;
        display: flex;
        gap: 8px;
      }
      #controls button {
        font: inherit;
        padding: 6px 12px;
      }
    </style>
  </head>
  <body>
    <div id="visible-block" class="block">VISIBLE-CONTENT</div>

    <div id="fragile-wrap">
      <div id="fragile-secret" data-feedback-capture-mask>
        SECRET-IN-FRAGILE-WRAP-abcdef0123456789
      </div>
    </div>

    <div id="tag-trigger" hidden>
      <e2e-secret-box data-feedback-capture-mask>TAG-STYLED-SECRET-abcdef0123456789</e2e-secret-box>
    </div>

    <div id="controls">
      <button id="e2e-fail-ignore" type="button">触发失败（ignore 机制）</button>
      <button id="e2e-fail-tag" type="button">触发失败（tag 机制）</button>
      <button id="e2e-reset" type="button">复位</button>
      <button id="e2e-retake" type="button">重拍</button>
    </div>

    <script>
      // 测试脚手架（仅 e2e）：只调用产品文档里的公开 API（captureProvider /
      // retakeScreenshot）与真实的宿主 DOM 操作。
      window.__fbE2E = {
        messages: [],
        widget: () => document.querySelector('feedback-widget'),
        async installLeakyProvider(url) {
          const res = await fetch(url, { cache: 'no-store' });
          const blob = await res.blob();
          const bmp = await createImageBitmap(blob);
          const w = bmp.width;
          const h = bmp.height;
          bmp.close();
          // 故意不返回 sameFrameMasking / maskedRegions
          this.widget().captureProvider = async () => ({
            blob,
            width: w,
            height: h,
            viewport: { width: w, height: h },
          });
          return { width: w, height: h, bytes: blob.size };
        },
        clearProvider() {
          this.widget().captureProvider = null;
        },
        failIgnore() {
          document.getElementById('fragile-wrap').setAttribute('data-html2canvas-ignore', '');
        },
        failTag() {
          document.getElementById('fragile-wrap').hidden = true;
          document.getElementById('tag-trigger').hidden = false;
        },
        reset() {
          document.getElementById('fragile-wrap').removeAttribute('data-html2canvas-ignore');
          document.getElementById('fragile-wrap').hidden = false;
          document.getElementById('tag-trigger').hidden = true;
        },
        state() {
          const vis = (el) =>
            !!el && el.getClientRects().length > 0 && getComputedStyle(el).visibility === 'visible';
          return {
            fragileVisible: vis(document.getElementById('fragile-secret')),
            fragileWrapIgnored: document
              .getElementById('fragile-wrap')
              .hasAttribute('data-html2canvas-ignore'),
            tagTriggerVisible: vis(document.querySelector('e2e-secret-box')),
            realSensitiveVisible: [
              document.querySelector('input[type="password"]'),
              document.getElementById('fragile-secret'),
              document.querySelector('e2e-secret-box'),
            ].filter((el) => vis(el)).length,
          };
        },
        thumbSrc() {
          const img = this.widget().shadowRoot.querySelector('.fb-screenshot-thumb');
          return img ? img.getAttribute('src') : null;
        },
        screenshotVisible() {
          const wrap = this.widget().shadowRoot.querySelector('.fb-screenshot-wrap');
          return !!wrap && !wrap.hidden;
        },
        statusText() {
          const el = this.widget().shadowRoot.querySelector('.fb-status');
          return el ? el.textContent : '';
        },
        async blobBase64() {
          const img = this.widget().shadowRoot.querySelector('.fb-screenshot-thumb');
          if (!img || !img.getAttribute('src')) return null;
          const res = await fetch(img.getAttribute('src'));
          const bytes = new Uint8Array(await res.arrayBuffer());
          let s = '';
          const chunk = 0x8000;
          for (let i = 0; i < bytes.length; i += chunk) {
            s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
          }
          return btoa(s);
        },
      };
      window.addEventListener('message', (ev) => {
        window.__fbE2E.messages.push({
          origin: ev.origin,
          type: ev.data && ev.data.type,
          nonce: ev.data && ev.data.nonce,
          token: ev.data && ev.data.accessToken,
        });
      });
      document.getElementById('e2e-fail-ignore').addEventListener('click', () => window.__fbE2E.failIgnore());
      document.getElementById('e2e-fail-tag').addEventListener('click', () => window.__fbE2E.failTag());
      document.getElementById('e2e-reset').addEventListener('click', () => window.__fbE2E.reset());
      document.getElementById('e2e-retake').addEventListener('click', () => window.__fbE2E.widget().retakeScreenshot());
    </script>

    <script src="/sdk/feedback-web.umd.js"></script>
    <feedback-widget
      id="widget"
      api-base="http://localhost:8787"
      app-id="com.example.demo-e2e"
      app-version="3.1.4"
      page-label="e2e-maskfail"
      side="right"
      launcher-mode="orb"
      capture-mode="viewport"
    ></feedback-widget>
  </body>
</html>
