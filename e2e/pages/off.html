<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>E2E 宿主页 · 旧式宿主（显式 tab + capture-mode off）</title>
    <!--
      e2e 专用宿主页（不是产品代码）。

      存在的理由：模拟 0.10 之前的存量宿主形态——**显式**声明
      `launcher-mode="tab"` 与 `capture-mode="off"`（不自动截图）。
      0.10 起组件默认值改为 launcher-mode=beam、capture-mode=viewport，
      本页保留旧行为只能靠显式属性；断言意图不变。

      断言目标：capture-mode=off 宿主呼出面板时，**截图区必须真的不可见**，
      且不得出现 `.fb-screenshot-thumb` 的空 src 破图占位。
      历史缺陷：`.fb-screenshot-wrap { display: flex }` 会盖掉浏览器默认的
      `[hidden] { display: none }`，导致 `hidden = true` 完全失效。
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }
      #plain {
        position: absolute;
        left: 40px;
        top: 40px;
        font-size: 16px;
        color: #111111;
      }
    </style>
  </head>
  <body>
    <div id="plain">DEFAULT-CAPTURE-MODE-HOST</div>
    <!-- 标记文本保持原样：脚本按 DEFAULT-CAPTURE-MODE-HOST 定位本页。 -->

    <script>
      // 测试脚手架（仅 e2e）：与 mask.html 同一套读取入口（本页无任何敏感区）。
      window.__fbE2E = {
        widget: () => document.querySelector('feedback-widget'),
        thumbSrc() {
          const img = this.widget().shadowRoot.querySelector('.fb-screenshot-thumb');
          return img ? img.getAttribute('src') : null;
        },
        async blobBase64() {
          const img = this.widget().shadowRoot.querySelector('.fb-screenshot-thumb');
          if (!img || !img.getAttribute('src')) return null;
          const res = await fetch(img.getAttribute('src'));
          const bytes = new Uint8Array(await res.arrayBuffer());
          let s = '';
          const chunk = 0x8000;
          for (let i = 0; i < bytes.length; i += chunk) {
            s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
          }
          return btoa(s);
        },
      };
    </script>

    <script src="/sdk/feedback-web.umd.js"></script>
    <!-- 显式声明旧宿主形态：贴边标签 + 关闭自动截图（0.10 默认已是 beam + viewport） -->
    <feedback-widget
      id="widget"
      api-base="http://localhost:8787"
      app-id="com.example.demo-e2e"
      app-version="3.1.4"
      page-label="e2e-off"
      launcher-mode="tab"
      capture-mode="off"
    ></feedback-widget>
  </body>
</html>
