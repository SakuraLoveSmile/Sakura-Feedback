# 生产部署（U1 起）：拉取 GitHub Actions 构建的固定 digest 镜像，不构建、不跟随 latest。
# 详细步骤见 docs/deployment.md 与 deploy/README.md。
#
# 两个服务，一张 compose 网络：
#   feedback  对外提供反馈与管理页；只读挂载更新控制目录，**不挂 docker socket**
#   updater   后台「一键更新」的执行器；挂 docker socket 与部署目录，**不发布端口**（仅内网 http://updater:8790）
#
# 前置：
#   cp deploy/.env.prod.example deploy/.env.prod    # 填 MASTER_KEY / 域名 / 两个镜像 digest / 数据卷名
#   bash deploy/install-updater.sh --deploy-dir /opt/1panel/docker/compose/feedback
#     └ 首次接入：核对运行中的部署 → 备份现有 compose 与环境文件 → 生成 600 令牌 → 登记既有数据卷
#   docker compose -f /opt/1panel/docker/compose/feedback/compose.yml \
#     --env-file /opt/1panel/docker/compose/feedback/.env.prod up -d
#
# 关键约束：
#   - 端口只绑服务器回环，公网入口一律走 Nginx TLS 终止（deploy/nginx/feedback.conf.template）。
#   - FEEDBACK_PUBLIC_URL 必填：Cookie 写操作的同源校验以它为准（反向代理会改写内部请求 URL）。
#   - 镜像用 digest 固定（image: ...@sha256:...），不使用可变标签；后台一键更新只改 .env.prod 里的
#     FEEDBACK_IMAGE 与 FEEDBACK_DATA_VOLUME 两行，其它行保持不变。
#   - feedback-data 声明为 external 卷（name: ${FEEDBACK_DATA_VOLUME}）：compose 既不创建也不删除它，
#     升级时由 updater 复制出新卷并改写这个变量，旧卷作为本轮完整备份保留。
#   - 部署目录（含 compose.yml、.env.prod、update-control/）在宿主与容器内保持同一绝对路径。

services:
  feedback:
    image: ${FEEDBACK_IMAGE:?请设置 FEEDBACK_IMAGE=ghcr.io/sakuralovesmile/sakura-feedback@sha256:<digest>}
    ports:
      # 只绑回环：外部无法直连 8787，必须经 Nginx HTTPS。
      # 宿主端口通过 FEEDBACK_BIND 登记（默认 127.0.0.1:8787），install-updater.sh 会按运行中容器的实际绑定写回，
      # 避免静默改动端口暴露；非回环地址会被脚本拒绝。
      - "${FEEDBACK_BIND:-127.0.0.1:8787}:8787"
    environment:
      # 生产固定值（优先于 env_file，避免文件里漏配导致降级）
      FEEDBACK_PUBLIC_URL: ${FEEDBACK_PUBLIC_URL:?请设置 FEEDBACK_PUBLIC_URL=https://<域名>}
      FEEDBACK_COOKIE_SECURE: "true"
      FEEDBACK_DATA_DIR: /data
      FEEDBACK_PORT: "8787"
      # 后台「系统更新」：经 compose 内网调用 updater；控制目录只读；令牌从 600 文件读取
      FEEDBACK_UPDATER_URL: ${FEEDBACK_UPDATER_URL:-http://updater:8790}
      FEEDBACK_UPDATE_CONTROL_DIR: ${FEEDBACK_UPDATE_CONTROL_DIR:?请在 .env.prod 设置 FEEDBACK_UPDATE_CONTROL_DIR}
      FEEDBACK_UPDATE_TOKEN_FILE: ${FEEDBACK_UPDATE_TOKEN_FILE:?请在 .env.prod 设置 FEEDBACK_UPDATE_TOKEN_FILE}
    env_file:
      # FEEDBACK_MASTER_KEY / FEEDBACK_ADMIN_USER / FEEDBACK_ADMIN_PASSWORD
      - .env.prod
    volumes:
      # 数据卷：实际卷名由 FEEDBACK_DATA_VOLUME 决定（external，compose 不创建/不删除）
      - feedback-data:/data
      # 更新控制目录：宿主与容器内同一绝对路径，只读（paused / release / state）
      - ${UPDATER_DEPLOY_DIR:?请在 .env.prod 设置 UPDATER_DEPLOY_DIR}/update-control:${UPDATER_DEPLOY_DIR}/update-control:ro
    restart: unless-stopped
    # 停机备份依赖优雅退出（SIGTERM → 排空队列 → checkpoint WAL 并关闭 SQLite）。
    # 默认 10s 会早于应用自身的 20s 排空预算触发 SIGKILL，导致 WAL 残留。
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  updater:
    image: ${UPDATER_IMAGE:?请设置 UPDATER_IMAGE=ghcr.io/sakuralovesmile/sakura-feedback-updater@sha256:<digest>}
    environment:
      UPDATER_LISTEN: 0.0.0.0:8790
      # 受管 compose 的绝对路径（宿主与容器内同一路径）：默认 <deploy>/compose.yml；
      # 1Panel 等场景可用 docker-compose.yml——由 install-updater.sh 按 --compose-file 实际值登记
      UPDATER_COMPOSE_FILE: ${UPDATER_COMPOSE_FILE:?请在 .env.prod 设置 UPDATER_COMPOSE_FILE（受管 compose 绝对路径）}
      UPDATER_COMPOSE_PROJECT: ${UPDATER_COMPOSE_PROJECT:-feedback}
      UPDATER_SERVICE: ${UPDATER_SERVICE:-feedback}
      UPDATER_DEPLOY_DIR: ${UPDATER_DEPLOY_DIR:?}
      UPDATER_CONTROL_DIR: ${UPDATER_DEPLOY_DIR:?}/update-control
      UPDATER_STATE_DIR: ${UPDATER_DEPLOY_DIR:?}/update-control/state
      UPDATER_TOKEN_FILE: ${UPDATER_DEPLOY_DIR:?}/update-control/updater-token
      # 受管镜像名（不含标签/digest）：由它推导版本清单地址并拼出要拉取的镜像引用
      UPDATER_IMAGE_NAME: ${UPDATER_IMAGE_NAME:?请在 .env.prod 设置 UPDATER_IMAGE_NAME（如 ghcr.io/sakuralovesmile/sakura-feedback）}
      UPDATER_PROTOCOL_VERSION: "1"
    volumes:
      # 同一绝对路径挂载整个部署目录：执行器改的就是宿主上的同一个 compose.yml 与 .env.prod
      - ${UPDATER_DEPLOY_DIR:?}:${UPDATER_DEPLOY_DIR:?}
      # docker socket = 宿主管理权限（详见 docs/deployment.md「updater 与安全边界」），不能当成代码级隔离
      - /var/run/docker.sock:/var/run/docker.sock
    # 刻意不写 ports：只有同一 compose 网络内的 feedback 能访问 http://updater:8790
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8790/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # 既有数据卷登记为外部卷：绝不声明新的可创建卷来替换既有数据。
  # 真实卷名示例（compose 默认项目前缀）：feedback_feedback-data
  feedback-data:
    external: true
    name: ${FEEDBACK_DATA_VOLUME:?请设置 FEEDBACK_DATA_VOLUME（既有数据卷名，如 feedback_feedback-data）}
