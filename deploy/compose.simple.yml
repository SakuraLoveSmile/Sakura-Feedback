# 生产部署：单服务、可变镜像标签、compose 自管理的数据卷。
#   - 更新 = docker compose pull && up -d（或 deploy/update.sh 一条命令，会先打卷备份）
#   - 回退：改 FEEDBACK_IMAGE 为旧版本标签（如 ...:v0.4.0）后 up -d；
#     注意数据库迁移是单向的，跨 schema 版本回退必须先恢复 update.sh 的备份包
#
# 使用：
#   bash deploy/bootstrap.sh   # 首次部署（交互式：生成密钥、写 .env.prod、启动）
#   bash deploy/update.sh      # 之后的每次更新

services:
  feedback:
    image: ${FEEDBACK_IMAGE:-ghcr.io/sakuralovesmile/sakura-feedback:latest}
    # 流水线只产 linux/amd64；arm64 机器经模拟运行。服务器上无需理会。
    platform: ${FEEDBACK_PLATFORM:-linux/amd64}
    ports:
      # 只绑回环：外部无法直连 8787，公网入口一律走 Nginx TLS 终止
      - "${FEEDBACK_BIND:-127.0.0.1:8787}:8787"
    environment:
      FEEDBACK_PUBLIC_URL: ${FEEDBACK_PUBLIC_URL:?请在 .env.prod 设置 FEEDBACK_PUBLIC_URL=https://<域名>}
      FEEDBACK_COOKIE_SECURE: "true"
      FEEDBACK_DATA_DIR: /data
      FEEDBACK_PORT: "8787"
    env_file:
      # FEEDBACK_MASTER_KEY / FEEDBACK_ADMIN_USER / FEEDBACK_ADMIN_PASSWORD
      - .env.prod
    volumes:
      # 数据存放（.env.prod 里二选一）：
      #   不设变量 → 下方声明的命名卷 feedback-data（物理名 = FEEDBACK_DATA_VOLUME）
      #   目录挂载 → FEEDBACK_DATA_PATH=<宿主目录绝对路径>（如 /opt/feedback/data；
      #              必须绝对路径；注意区别于容器内路径变量 FEEDBACK_DATA_DIR）
      - ${FEEDBACK_DATA_PATH:-feedback-data}:/data
    restart: unless-stopped
    # 停机依赖优雅退出（SIGTERM → 排空队列 → checkpoint WAL 并关闭 SQLite）。
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  feedback-data:
    # 命名卷物理名（不带项目前缀）：默认 feedback-data；接管既有部署时在 .env.prod 设
    # FEEDBACK_DATA_VOLUME=<现有卷名> 即可复用数据（卷已存在则直接使用）。
    # 用目录挂载（FEEDBACK_DATA_PATH）时本声明不会被创建，FEEDBACK_DATA_VOLUME 无需设置。
    name: ${FEEDBACK_DATA_VOLUME:-feedback-data}
